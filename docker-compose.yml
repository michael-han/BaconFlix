services:
  baconflix-bot:
    image: ghcr.io/michael-han/baconflix:latest
    restart: unless-stopped
    # Values are read from your shell or from a .env file next to this file.
    # Optional settings left blank fall back to their defaults.
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      RADARR_URL: ${RADARR_URL}
      RADARR_API_KEY: ${RADARR_API_KEY}
      RADARR_QUALITY_PROFILE_ID: ${RADARR_QUALITY_PROFILE_ID:-}
      RADARR_ROOT_FOLDER: ${RADARR_ROOT_FOLDER:-}
      ALLOWED_GUILD_IDS: ${ALLOWED_GUILD_IDS:-}
      ALLOWED_ROLE_IDS: ${ALLOWED_ROLE_IDS:-}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-}
      RATE_LIMIT_WINDOW_MINUTES: ${RATE_LIMIT_WINDOW_MINUTES:-}
      DISK_SPACE_MIN_GB: ${DISK_SPACE_MIN_GB:-}
      HTTP_TIMEOUT_MS: ${HTTP_TIMEOUT_MS:-}
      INSECURE_TLS: ${INSECURE_TLS:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
